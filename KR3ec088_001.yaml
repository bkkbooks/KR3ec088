body:
  text: 正文按雷公炮製法有十七曰炮曰爁曰爆曰炙曰煨曰炒曰煅曰煉曰制曰度曰飛曰伏曰鎊曰摋曰曬曰曝曰露是也用者宜如法各盡其宜水部雨水立春節雨水梅雨水芒種後逢壬為入梅小暑後逢壬為出梅液雨水立冬後十日為入液至小雪為出液得雨謂之液雨冬霜凡收霜以雞羽掃之瓶中密封陰處久亦不壞臘雪用淨瓶收淨雪築實密封瓶口置於陰室中不見日色春雪有蟲水亦便敗所以不收神水五月五日午時有雨急伐竹竿中必有神水瀝取為藥半天河此竹籬頭水及空樹穴中水也流水千里水東流水二水皆堪蕩滌邪穢煎煮湯液勞水即揚泛水張仲景謂之甘爛水用流水二斗置大盆中以杓高揚之千萬遍有沸珠相逐乃取煎藥蓋水性本鹽而體重勞之則甘而輕取其不助腎氣而益脾胃也虞摶醫學正傳云甘爛水甘溫而性柔故烹傷寒陰證等藥用之順流水性順而下流故治下焦腰膝之證及通利夫小便之藥用之急流水湍上峻急之水其性急速而下達故通二便風痹之藥用之逆流水洄瀾之水其性逆而倒上故發吐痰飲之藥用之也井泉水反酌而傾曰倒流出就瓦未放曰無根無時初出曰新汲將旦首汲曰井華地漿此掘黃土地作坎深三尺以新汲水沃入攪濁少頃取清用之熱湯須百沸者佳若半沸者飲之反傷元氣作脹生熟湯以新汲水百沸湯合一盞和勻故曰生熟今人謂之陰陽水菊潭水山澗兩岸有天生甘菊花其下流泉是也漿水漿酢也炊粟米熱投冷水中浸五六日味酢生白花色類漿故名若浸至敗者害人米泔水即淘米汁也繅絲湯以瓷瓶收密封埋淨土地中任經數年久而愈妙火部桑柴火凡一切補藥諸膏宜此火煎之炭火櫟炭火宜煅煉一切金石藥烰炭火宜烹煎焙炙百藥丸散蘆火竹火宜煎一切滋補藥凡服湯藥雖品物專精修治如法而煎藥者鹵莽造次水火不良火候失度則藥亦無功觀夫茶味之美惡飯味之甘餲皆繫於水火烹飪之得失即可推矣是以煎藥須用小心老成人以深罐密封新水活火先武后文如法服之未有不效者火用陳蘆枯竹取其不強不損藥力也土部黃土三尺以上曰糞三尺以下曰土凡用當去上惡物勿令入客水東壁土此屋之東壁上土爾當取東壁之東邊謂常先見日光刮取用之伏龍肝凡使勿誤用灶下土其伏龍肝是十年以來灶額內火氣積久自結如赤色石中黃其形貌八稜取得後細研以滑石水飛過兩遍令乾用熟絹裹卻取子時安於舊額內一伏時重研了用自然銅生出銅處方圓不定色青黃如銅凡使用甘草湯煮一伏時至明漉出攤令乾入臼中搗了重篩過以醋浸一宿至明用六一混泥瓷盒子盛二升文武火養三日夜才幹用蓋蓋了火墨陳久而料精者入藥新而粗者不堪百草霜此乃灶額及煙爐中墨煙也其質輕細故謂之霜山莊人家者良梁上塵須去煙火遠高堂殿上者拂下篩用之一云凡用倒掛塵燒令煙盡篩取末入藥雷氏所說似是梁上灰塵今人不見用金部金銀銅鐵凡使只可渾安在藥中借氣生藥力而已勿入藥服能消人脂赤銅屑即打銅落下屑也或以紅銅火煅水淬亦自落下以水淘淨用好酒入砂鍋內炒見火星取研末用煅兩伏時去土研如粉用凡修事五兩以醋兩鎰為度今人只以火煅醋淬七次研細水飛過用一云制後半年方可入藥否則殺人銅青生熟銅皆有青則銅之精華大者即空緑以次空青也銅青則是銅器上緑色者淘洗用之近時人以醋製銅生緑取收曬乾貨之鉛凡用以鐵銚熔化瀉瓦上濾去渣腳如此數次收用其黑錫灰則以鉛沙取黑灰白錫灰不入藥鉛霜以鉛打成錢穿成串瓦盆盛生醋以串橫盆中離醋三寸仍以瓦盆覆之置陰處候生霜刷下仍合住鉛丹即黃丹也生鉛一味火煅研成細末水飛過用今貨者多以鹽硝砂石雜之凡用以水漂去硝鹽飛去砂石澄干微火炒紫色地上去火毒入藥密陀僧凡使搗細安甕堝中重紙袋盛柳蛀末焙之次下東流水浸滿火煮一伏時去柳末紙袋取用近人以煎銀爐底代之誤矣爐底能消煉一切衣帛焉可服耶如無真者勿用制狼毒古文錢周秦漢五代者方可用以火煅微紅淬醋中六七次用入目者磨用入散者用胡桃研成粉鐵鏽此鐵上赤衣也刮下用石部丹砂即硃砂也有數種硫砂如拳許大或重一鎰有十四面面如鏡若遇陰沉天雨即鏡面上有紅漿汁出有梅柏砂如梅子許大夜有光生照見一室有白庭砂如帝珠子許大面上有小星現有神座砂又有金座砂玉座砂不經丹灶服之而自延壽命次有辰錦砂芙蓉砂箭鏃砂以上九種皆可入藥用丹砂入藥只宜生用慎勿升煉一經火煉餌之殺人研須萬遍要若輕塵以磁石吸去鐵氣惡磁石畏鹽水車前石葦皂莢決明瞿麥南星烏頭地榆桑椹紫河車地丁馬鞭草地骨皮陰地厥白附子忌諸血雲母凡使色黃黑者厚而頑赤色者經婦人手把者並不中用須要光瑩如冰色者為上凡修事一斤先用小地膽草紫背天葵生目草地黃汁各一鎰乾者細銼濕者取汁了於瓷堝中安雲母於諸藥了下天池水三鎰著火煮煮一日夜水火勿令失度其雲母自然成碧玉漿在鍋底卻以天池水猛投其中將物攪之浮如堝涎者即去之如此三度淘淨了取沉香一兩搗作末以天池水煎沉香湯三升以來分為三度再淘雲母漿了日中曬任用之澤瀉為之使惡徐長卿羊血畏鮀甲礬石東流水百草上露茅屋漏水制汞伏丹砂石鐘乳凡使勿用頭粗厚並尾大者為孔公石不用色黑及經大火驚過並久在地上收者曾經藥物制者並不得用須要鮮明薄而有光潤者似鵝翎筒子為上有長五六寸者凡修事法以五香水煮過一伏時然後漉出又別用甘草紫背天葵汁漬再煮一伏時凡八兩鍾乳用沉香零陵藿香甘松白茅等各一兩以水先煮過一度了第二度方用甘草等二味各二兩再煮了漉出拭乾緩火烘之然後入臼杵如粉篩過卻入鉢中令有力少壯者三兩人不住研三日夜勿歇然後用水飛澄了以絹籠之於日中曬令乾又入鉢中研二萬遍後以瓷盒子收貯用之蛇床為之使惡牡丹玄石牡蒙人參二術忌羊血畏紫石英蓑草韭實獨蒜胡蔥胡荽麥門冬貓兒眼草礬石生用解毒煅用生肌甘草為之使惡牡蠣畏麻黃紅心灰藋芒硝水飛過用五重紙滴過去腳於鐺中干之方入乳鉢研如粉任用芒硝是朴硝中煉出形似麥芒者號曰芒硝火為之使惡苦參苦菜畏女菀杏仁竹葉滑石以刀刮去浮面黃者研如粉以牡丹皮同煮伏時出去牡丹皮取滑石卻用東流水淘飛去下腳七次於日中曬乾方用白如凝脂軟滑者良石葦為之使惡曾青制雄黃赤石脂研如粉新汲水飛過三度曬乾用亦有火煅水飛者惡大黃松脂畏芫花豉汁畏黃芩大黃官桂白石英可煮汁用張仲景只令㕮咀不為細末惡馬目毒公紫石英煮汁用或火燒醋淬為末敷毒長石為之使得茯苓人參芍藥主心中結氣得天雄菖蒲主霍亂惡鮀甲黃連麥句姜畏扁青附子及酒爐甘石以炭火煅紅童便淬七次水洗淨研粉水飛過曬用緑礬火煅通紅淬入米醋中烘乾研如飛粉畏醋雄黃取透明色鮮紅質嫩者研如飛塵水飛數次畏南星地黃萵苣地榆黃芩白芷當歸地錦苦參五加皮紫河車五葉藤鵝腸草雞腸草鵝不食草圓桑葉蝟脂石硫黃研如飛塵用以殺蟲行血曾青石亭脂為之使畏細辛朴硝鐵醋黑錫豬肉鴨汁余甘子桑灰益母天鹽車前黃柏石葦蕎麥獨帚地骨皮地榆蛇床萆麻菟絲蠶砂紫河波稜桑白皮馬鞭草食鹽凡鹽多以礬硝石灰之類雜之入藥須用水化澄去腳滓煎煉白色乃良漏蘆為之使水銀凡使草中取者並舊朱漆中者經別藥制過者在尸過者半生半死者俱勿用在硃砂中産出者其色微紅收得後用蘆葫收免遺失先以紫背天葵並夜交藤自然汁二味同煮一伏時其毒自退若修十兩用前二味汁各七鎰和合煮足為度畏磁石砒石黑鉛硫黃大棗蜀椒紫河車松脂松葉荷葉穀精草金星草萱草夏枯草莨菪子雁來紅馬蹄香獨腳蓮水慈菰瓦松忍冬水銀粉凡水銀一斤用明礬焰硝皂礬食鹽各二兩同一處研以不見汞星為度用烏瓷盒二個以藥鋪盆內上用一盆合定以鹽泥石膏蜜醋調封盆口勿令泄氣下盆底用鐵釘三腳支住四五寸高用炭火先文後武蒸半日次日冷定輕輕取起上盆則輕粉盡騰其上以鵝翎掃下聽用此乃真正輕粉生肌立效市肆多攙寒水石銀母石石膏焉得有用乎黃連土茯苓陳醬黑鉛鐵漿可制其毒戎鹽即青鹽溫水洗去塵土淨曬乾入藥石膏雪白有牆壁者真即市之寒水石也石臼中搗成粉以密絹羅過生甘草水飛過了水澄令乾重研用之作散者煅熟入煎劑半生半熟雞子為之使畏鐵惡莽草巴豆馬目毒公磁石欲驗者一斤磁石四面只吸鐵一斤者此名延年沙四面只吸得鐵八兩者號曰續末石四面只吸得五兩以來者號曰磁石修事一斤用五花皮一鎰地榆一鎰故綿十五兩三件並細銼以槌於石上碎作二三十塊子將磁石於瓷瓶中下草藥以東流水煮三日夜然後漉出拭乾以布裹之向大石上再槌令細了卻入乳鉢中研細如塵以水沉飛過了又研如粉用之柴胡為之使殺鐵毒消金惡牡丹莽草畏黃石脂伏丹砂養汞去鍋暈起陽石用火煅透紅研極細如面桑螵蛸為之使惡澤瀉雷丸菌桂石葵蛇蛻皮畏菟絲子忌羊血瑪瑙犬肉內煮之火煅紅醋淬用試瑪瑙法以砑木不熱者為真石灰凡使用醋浸一宿漉出待乾下火煅令腥穢之氣出用瓶盛著密蓋放令拭上灰令淨細研用去錫暈制三黃硇砂硝石砒霜凡使用小瓷瓶子盛後入紫背天葵石龍芮二味三件便下火煅從巳至申便用甘草水浸從申至子出拭乾入瓶盛於火中鍛別研三萬下用之一法每砒霜一兩打碎用明礬一兩為末蓋砒上貯罐中入明火一煅以枯礬為度砒之悍氣隨煙而去駐形於礬中者庶幾無大毒用之不傷也用砒霜即用礬霜是也似簡便畏緑豆冷水青鹽鶴頂草硝石蒜水蓼常山益母獨帚木葎菖蒲三角酸鵝不食草波稜萵苣皆能伏砒礞石與火硝相半入陽成罐封固煅存性研如飛塵入藥得焰硝良花乳石出陝華諸郡色正黃形之大小方圓無定凡入丸散以罐固濟頂火煅過出火毒研細水飛曬乾用蓬砂即硼砂也白如明礬者良研如飛塵畏知母蕓薹紫蘇甑帶何首烏鵝不食草草部人參色微黃皮薄滋潤明亮闊而獨株味甘回味不苦者良去蘆茯苓馬藺為之使惡滷咸溲疏畏五靈脂天門冬劈破去心用柳木甑燒柳木柴蒸一伏時灑酒令逼更添火蒸出曝地黃貝母垣衣為之使忌鯉魚畏魯青浮萍制雄黃硇砂麥門冬産杭州莧橋細白而皺者良水洗去心大抵一斤須減去五六兩凡入湯液或以水潤去心或以瓦焙乘熱去心若入丸散須瓦焙熟即於風中吹冷如此三四次即易燥且不損藥力或以湯浸搗膏和藥亦可滋補藥則以酒浸擂之地黃車前為之使惡款冬苦芙苦瓠畏苦參青葙木耳伏石鐘乳甘草須去頭尾尖處頭尾吐人截作三寸長劈破作六七片以瓷器盛之用浸蒸從巳至午出曝乾或用清水蘸炙或切片用蜜水拌炒如瀉火生用術苦參乾漆為之使惡遠志忌豬肉生地黃大如大指堅實者佳酒洗曬乾以手擘之有聲為度好酒拌勻置瓷甕內包固重湯煮一晝夜勝於蒸者名熟地黃生者酒洗用得酒麥門冬薑汁縮砂良惡貝母畏蕪荑忌蔥蒜蘿蔔諸血制地黃勿犯銅鐵器令人腎消並白髮男損營女損衛也菖蒲勿用泥菖夏菖其二件相似如竹根鞭形黑氣穢味腥不堪用石上生者根條嫩黃堅硬節稠長一寸有九節者是真也用銅刀刮上黃黑硬節皮一重了用嫩桑枝條相拌蒸出曝乾秦皮秦艽為之使惡麻黃地膽忌飴糖羊血鐵器黃連非真川黃連不效折之中有孔色如赤金者良去須切片分開粗細各置薑汁排透用綿紙襯先用山黃土炒乾研細再炒至將紅以連片隔紙放上炒乾再加薑汁切不可用水紙焦易新者如是九次為度赤痢用濕槐花拌炒上法入痢藥中至於治本臟之火則生用之治肝膽之實火則以豬膽汁浸炒治肝膽之虛火則以醋浸炒治上焦之火則以酒炒治中焦之火則以薑汁炒治下焦之火則以鹽水或朴硝炒治氣分濕熱之火則以茱萸湯浸炒治血分塊中伏火則以乾漆水炒諸法不獨為之導引蓋辛熱能制其苦寒鹹寒能制其燥性在用者詳酌之黃芩龍骨理石為之使忌豬肉畏牛膝款冬惡冷水菊花玄參白殭蠶白蘚芫花胡黃連似干柳枝心黑外黃折之塵出如煙者真忌惡同黃連忌鐵菊花真者味甘色黃單瓣光心去蒂用術枸杞根桑根白皮青葙葉為之使白朮米泔浸去油者山黃土裹蒸曬九次洗淨去皮切片曬乾防風地榆為之使忌桃李雀肉菘菜青魚蒼朮出茅山細而帶糖香味甘者真米泔浸洗極淨刮去皮拌黑豆蒸又拌蜜酒蒸又拌人乳透蒸凡三次蒸時須烘曬極干氣方透忌同白朮菟絲子米泔淘洗極淨略曬揀去稗草子磨五六次酒浸一宿慢火煮乾木槌去殼一法用酒煮一晝夜搗作餅曬乾然後復研方細一法以白紙條同研方細薯蕷松脂為之使得酒良惡雚菌牛膝酒浸蒸曝乾形長二尺五寸以上者方佳蜀地及懷慶産者良惡螢火龜甲陸英畏白前忌牛肉茺蔚子花紅者良忌鐵制三黃砒石柴胡凡使莖長軟皮赤黃𥳍須出在平州平縣即今銀州銀縣也西畔生處有白鶴緑鶴於此翔處是柴胡香直上云間若有過往聞者皆氣爽此種治骨蒸不入發表藥去髭並頭勿令犯火立便無效也半夏為之使惡皂莢畏女菀藜蘆前胡切開白色者良水洗用竹刀刮去蒼黑皮並髭土了細銼以甜竹瀝浸令潤日中曬乾用使惡畏同柴胡獨活羌活細銼拌淫羊藿裛二日後曝乾去淫羊藿用兔煩人心此服食家治法尋常去皮或焙用爾蟊實為之使升麻緑色者良治滯下用醋拌炒車前子自收玄色者良賣家多以葶藶子代充不可不辨使葉勿使蕊莖入補益藥中用米泔淘淨蒸入利水治泄瀉藥炒為末用常山為之使木香形如枯骨油重者良忌見火入煎藥磨汁內熟湯中服若實大腸宜麵煨熟用薯蕷補益藥及脾胃中熟用外科生用切用銅刀紫芝為之使惡甘遂葳蕤凡使勿用黃精並鉤吻二物相似葳蕤上有鬚毛莖斑葉尖處有小黃點為不同採得以竹刀刮去節皮洗淨以蜜水浸宿蒸了焙乾用畏滷咸薏苡仁顆小色青味甘用糯米炒咬著黏人齒凡一兩以糯米一兩同炒令糯米熟去糯米取使或以鹽湯煮過亦得一法瀼湯泡三次去油蒸氣曬乾用澤瀉不油不蛀者良細銼酒浸一宿漉出曝乾用一法米泔浸去毛蒸或搗碎焙畏海蛤文蛤忌鐵遠志去心若不去心服之令人悶去心了用熟甘草湯浸一宿漉出曝乾用之得茯苓龍骨冬葵子良畏真珠飛廉藜蘆齊蛤龍膽草甘草湯中浸一宿至明漉出曝乾用勿空腹餌之令人溺不禁貫衆赤小豆為之使惡地黃防葵細辛揀去雙葉服之害人洗淨去泥沙曾青草根為之使忌生菜貍肉惡黃耆狼毒山茱萸畏滑石硝石石斛長而中實味不苦者真去頭土了用酒浸一宿漉出於日中曝乾卻用酥蒸從巳至酉卻徐徐焙乾用石斛鎖陽澀丈夫元氣如斯修事服滿一鎰永不骨痛暫使酒蒸用服餌當如法陸英為之使惡凝水石巴豆畏雷丸巴戟天去心用枸杞子湯浸一宿待稍軟漉出卻用酒浸一伏時又漉出用菊花同熬令焦黃去菊花用布拭令乾用今法惟以酒浸一宿銼焙入藥若急用只以溫水浸軟去心也覆盆子為之使惡雷丸丹參朝生菴䕡子煮汁作飲為末作散俱可荊子薏苡為之使芎藭形塊重實色白者良白芷為之使畏黃連伏雌黃刺蒺藜淨揀擇了蒸從午至酉出曬乾於木臼中舂令皮上刺盡用酒拌再蒸從午至酉出曬乾用一法炒研去刺為末如入煎藥臨時調服不入湯煎烏頭為之使沙苑蒺藜緑色形如腰子細而香如天池茶者真即同州多僞者或炒或酒漿拌蒸亦不入湯藥黃耆軟如綿直而細中有菊心味甘者良補氣藥中蜜炙用瘡瘍藥中鹽水炒用俱去皮茯苓為之使惡白蘚龜甲肉蓯蓉肥大者良用清酒浸一宿至明以棕刷上去沙土浮甲盡劈破中心去白膜一重如竹絲草樣是此偏隔人心前氣不散令人上氣不出凡使用先須酒浸並刷草了卻蒸從午至酉出又用酥炙得所忌鐵防風實而潤頭節堅者良去蘆並叉頭叉尾者形彎者令人吐勿用畏萆薢惡乾薑藜蘆白蘞芫花蒲黃自採者真勿用松黃並黃蒿其二件全似只是味粗及吐人凡欲使蒲黃鬚隔三重紙焙令色黃蒸半日卻焙令乾用之妙行血生用止血炒用續斷皺皮黃色折之煙塵起者良用酒浸一伏時捶碎去筋焙乾用地黃為之使惡雷丸漏蘆枯黑如漆味不苦酸者真細銼拌生甘草相對蒸從巳至申去甘草揀淨用連翹為之使天名精一名過冬青即荔枝草吳人又呼為天麻地菘擂汁服垣衣地黃為之使決明子炒研蓍實為之使惡大麻子丹參去蘆賣家多染色須辨之畏鹽水茜根勿用赤柳草根真似茜根只是滋味澀不入藥中用若服令人患內瘴眼速服甘草水解之凡使用銅刀於槐砧上銼曬乾勿犯鐵並鉛畏鼠姑制雄黃五味子遼東者佳去枯者銅刀劈作兩片用蜜浸蒸從巳至申或曬或烘炒蓯蓉為之使惡葳蕤勝烏頭忍冬花四月採藤葉不拘時採俱陰乾不見日火蛇床子凡使須用濃鹽汁百部煎濃汁二味同浸三伏時漉出曬乾卻用生地黃汁相拌蒸從午至亥曬乾用惡牡丹貝母巴豆伏硫黃茵陳蒿須用葉有八角者採得陰乾去根細銼用勿令犯火山茵陳俗呼為帝鍾茵陳即八角也伏硇砂沙參去蘆白實味甘者良惡防己王不留行拌濕蒸之從巳至未以漿水浸一宿焙乾用乾薑馬湖者良微炒若治産後血虛發熱及止血俱炒黑溫中炮用散寒邪理肺氣止嘔生用秦椒為之使惡黃芩黃連天鼠糞殺半夏南星莨菪毒生薑不宜使熟宜搗絞汁待藥煎成傾入方不失生字之義如入藥煎乃熟姜非生薑矣使惡殺同乾薑蒼耳實蒸用或炒熟搗去刺用忌豬肉馬肉米泔葛根雪白多粉者良葛花消酒煎飲栝蔞根雪白多粉者良枸杞為之使惡乾薑畏牛膝乾漆栝蔞仁搗碎用粗紙壓去油苦參先須用糯米濃泔汁浸一宿上有腥穢氣並在水面上浮並須重重淘過即蒸從巳至申出曝乾細銼用之不入湯藥玄參為之使惡貝母漏蘆菟絲子伏汞雌黃焰硝當歸色白味甘者良去塵並頭尖硬處一分以來洗淨酒浸一宿若要破血即使頭一節硬實處若要止痛止血即用尾若一概用不如不使服食無效單使妙也惡䕡茹濕面制雄黃畏菖蒲生薑海藻牡蒙麻黃陳久者良去節並沫若不盡服之令人悶用夾刀煎去節並頭槐砧上用銅刀細銼煎三四十沸竹片掠去上沫盡漉出熬乾用之厚朴白薇為之使惡辛夷石葦白芍藥以竹刀刮去粗皮並頭土了銼之將蜜水拌蒸從巳至未曝乾用之今人多以酒浸蒸切片或用煩亦良須丸烏藥末藥為之使惡石斛芒硝赤芍藥制度並使惡同白芍藥瞿麥只用蕊殼不用莖葉若一時使即空心令人氣咽小便不禁凡欲用先須以蓳竹瀝浸一伏時漉出曬乾用牡丹蓑草為之使惡螵蛸伏丹砂玄參墨黑者良用蒲草重重相隔入甑蒸兩伏時後出干勿令犯銅鐵餌之噎人喉喪人目揀去蒲草盡了用之一法用酒洗去塵土切片曬乾用惡黃耆乾薑大棗山茱萸秦艽凡使秦並艽須於腳文處認取左文列為文即治疾艽即髮腳氣凡用秦先以布拭上黃肉毛盡然後用童便浸一宿至明出曬乾用菖蒲為之使畏牛乳百合白花者良酒拌蒸知母皮黃肉白者良於槐砧上細銼焙乾木臼杵搗一法去毛蜜炙勿令犯鐵器得黃柏及酒良伏硼砂鹽貝母黃白輕鬆者良先於柳木灰中炮令黃劈破去內口鼻上有米許大者心一小顆後拌糯米於銚上同炒待米黃熟然後去米取出其中有獨顆團不作兩片無皺者號曰丹龍精不入藥用若誤服令人筋脈不收用黃精小藍汁合服立愈厚朴白薇為之使惡桃花畏秦艽莽草礜石白芷白色不蛀者良當歸為之使惡旋覆花制雄黃硫黃淫羊藿細銼用羊脂相對拌炒過待羊脂盡為度每修事一斤用羊脂四兩為度也薯蕷紫芝為之使得酒良黃芩大肺經用枯芩去腐酒浸切炒入大腸或安胎等俱用子芩酒浸切炒龍骨山茱萸為之使惡蔥實畏丹砂牡丹藜蘆狗脊凡修事火燎去毛細銼了酒拌蒸從巳至申出曝乾用萆薢為之使惡莎草敗醬茅根洗淨搗爛勿用露根紫菀用東流水淘洗令淨用蜜浸一宿火上焙乾用凡修事一兩用蜜二分款冬為之使惡天雄藁本雷丸遠志瞿麥畏茵陳紫草真者方佳須用蠟水蒸之待水乾取去頭並兩畔髭細銼用每修事紫草一斤用蠟三兩於鐺中熔淨便投蠟水作湯用通草即木通也有紫白二色紫者皮厚味辛白者皮薄味淡二者皆能通利藁本去蘆水洗切惡䕡茹畏青葙子石葦背有黃毛須拭極淨羊脂拌炒焦黃色滑石杏仁射干為之使得菖蒲良制丹砂礬石萆薢其根細長淺白者真酒浸一宿焙乾忌鐵薏苡為之使畏前胡柴胡牡蠣大黃葵根土茯苓忌鐵茶白薇用糯米泔汁浸一宿至明取出去髭了於槐砧上細銼蒸從巳至申出用夏月浸二時許惡黃耆乾薑大棗山茱萸大黃大戟乾漆大青處處有之三四月採莖陰乾艾葉産蘄州者良入藥用新炙火用陳苦酒香附為之使惡實一名鼠黏子一名牛蒡子一名大力子用酒拌蒸待上有薄白霜重出卻用布拭上然後焙乾搗如粉用水萍紫背浮萍七月採之揀淨以竹篩攤曬下置水一盆映之即易干也王瓜根能吐下子生用潤心肺治黃病炒用治肺痿吐血腸風瀉血赤白痢反胃吐食取汁制雄汞地榆切之如綿者良酒洗得發良惡麥門冬伏丹砂雄黃硫黃大小薊根消腫搗汁止血燒灰存性海藻凡使先須用生烏豆並紫背天葵和海藻三件同蒸一伏時候曬乾用之近人但洗淨鹹味焙乾用反甘草澤蘭凡使先要別識雄雌其形不同大澤蘭形葉皆圓根青黃能生血調氣與大合小澤蘭迥別採得後看葉上斑根鬚尖莖方此藥能破血通久積凡修事大小澤蘭須細銼之用絹袋盛懸於屋南畔角上令乾用防己為之使昆布凡使先用弊甑簟同煮去鹹味焙細銼用每修事一斤用甑簟十個用昆布細銼二味各一處下東流水從巳至亥水旋添勿令少防己凡使勿使木條以其木條已黃腥皮皺上有子足子不堪用凡使防己要心花文黃色者然後細銼車前草根相對同蒸半日後出去車前草根細銼用之一法用酒洗切殷孽為之使惡細辛畏萆薢女菀滷咸殺雄黃硝石毒天麻透明者良天麻十兩用蒺藜子一鎰緩火熬焦熟後便先安置天麻十兩於瓶中上用火熬過蒺藜子蓋內外便用三重紙蓋並系從巳至未時又出蒺藜子再入熬炒准前安天麻瓶內用炒了蒺藜子於中依前蓋又隔一伏時後出如此七遍瓶盛出後用布拭上氣汗用刀劈焙之細銼單搗一法麵裹煨透切阿魏凡使各有訛僞有三驗第一驗將半銖安於銅器中一宿至明沾阿魏處白如銀汞無赤色第二驗將一銖置於五斗草自然汁中一夜至明如鮮血色第三驗將一銖安於柚樹上樹立干便是真色黑者力微黃溏者力上凡使先於淨鉢中研如粉了於熱酒器上裛過任入藥用香薷八九月開花著穗時採之去根留葉陰乾勿令犯火服至十兩一生不得食白山桃也百部根去心皮用酒浸一宿漉出焙乾細銼用款冬花花未舒者良去梗蒂甘草水浸一時曬乾用杏仁為之使得紫菀良惡玄參皂莢硝石畏貝母麻黃辛夷黃芩黃耆連翹青葙紅藍花自種者真得酒良牡丹皮凡使採得後曬乾用銅刀劈破去骨了細銼如大豆許用清酒拌蒸從巳至未出曬乾用闊而厚者良忌蒜胡荽伏砒畏菟絲子貝母大黃三稜去毛米醋浸一日切片炒或煮熟焙乾入藥乃良青黛水飛去腳緑中有石灰入服餌藥中宜飛淨用一法用青布浸汁代之鬱金色赤似薑黃蟬肚者良置生雞血中化成水者真磨汁臨服入藥蘆薈上有青竹文斑並光膩味極苦勿便和衆藥搗此藥先搗成粉待衆藥末出然後入藥中延胡索産茅山溪陵澗粒粒金黃色者良醋煮切肉豆蔻不油不蛀不皺皮者佳糯米作粉使熱湯搜裹豆蔻於糖灰中炮待米糰子焦黃熟然後出去米粉用勿令犯銅鐵白豆蔻藥煎成方炒研入一二沸即起入丸待諸藥細末後方入勿隔宿砂仁略炒吹去衣研用入湯丸法同白豆蔻得白檀香豆蔻為使入肺得人參益智為使入脾得黃柏茯苓為使入腎得赤白石脂為使入大小腸得訶子白蕪荑鱉甲良補骨脂即破故紙形圓實色黑者良此藥性本太燥每用酒浸一宿後漉出浮者去之卻用東流水浸三日夜卻蒸從巳至申出曬乾用忌鐵得胡桃胡麻良惡甘草忌諸血蕓薹蓬莪朮凡使於砂盆中用醋磨令盡然後於火畔吸令乾重篩過用一法火炮醋浸煨切得酒醋良白前用生甘草水浸一伏時後漉出去頭須了焙乾任入藥中用薺苨解百藥毒生搗汁服或末煮俱可白藥子末用香附細者佳去毛以水洗淨揀去砂石於石臼內搗去皮用童便浸透曬搗用或以酒醋酥鹽水薑汁浸俱瓦上焙乾得芎藭蒼朮醋童子小便良忌鐵鱧腸即旱蓮草性太寒宜熬膏用須日色中忌鐵使君子慢煨香熱用或云七生七煨食亦良忌飲熱茶犯之即瀉翦草治肺熱吐血有神舊出婺州今産寧州附子底平有九角如鐵色一個重一兩即是氣全堪用修事十兩於文武火中炮令皴折者去之用刀刮上孕子並去底尖微細劈破於屋下午地上掘一坑可深一尺安於中一宿至明取出焙乾用麩炒欲炮者灰火勿用雜木火只用柳木最多若陰制使即生去尖皮底薄切用東流水並黑豆浸五日夜然後漉出於日中曝令乾用凡使須陰制去皮尖了每十兩用生烏豆五兩東流水六升一云此物性太烈古方用火炮不若用童便煮透尤良地膽為之使得蜀椒食鹽下達命門惡蜈蚣豉汁畏防風甘草人參黃耆緑豆烏韭童溲犀角半夏陳久者良若修事四兩用搗了白芥子末二兩頭醋六兩二味攪令濁將半夏投中洗三遍用之半夏上有巢涎若洗不淨令人氣逆肝氣怒滿若入治痰飲藥用白礬湯入薑汁浸透洗淨用無白星為度造麴法用半夏不拘多少將滾湯泡過宿搗爛每一斗入生薑一斤同搗之作餅子用干稻稈或粟麥稈𨠭之如𨠭曲法干久用射干柴胡為之使惡皂莢海藻飴糖羊血畏生薑乾薑秦皮龜甲雄黃大黃細切內文如水旋斑緊重銼蒸從巳至未曬乾又用臘水蒸從未至亥如此蒸七度卻酒薄蜜水再蒸一伏時其大黃譬如烏膏樣於日中曬乾用之為妙下藥酒浸一時煮二三沸即服黃芩為之使惡乾漆忌冷水桔梗味苦而有心者良凡使去頭上尖硬二三分以來並兩畔附梔子於槐砧上細銼用百合水浸一伏時漉出緩火熬令乾用每修事四兩用生百合五分搗作膏投於水中浸一法用米泔浸一宿微焙用節皮為之使畏白芨龍膽龍眼忌豬肉伏砒草蒿即青蒿葉細而香自採佳陰乾凡使唯中為妙到膝即仰到腰即俯使子勿使葉使根勿使莖四件若同使翻然成痼疾採得葉不計多少用童溺浸七日七夜後漉出曬乾伏硫黃旋覆花去裹花蕊殼皮並蒂蒸從巳至午曬乾用射干不辣者良米泔水浸一宿漉出然後用蓳竹葉煮從午至亥漉出曬乾用之常山如雞骨者良春使莖葉夏秋冬使根酒浸一宿至明漉出曬乾熬搗少用勿令老人久病者服之切忌畏玉札忌蔥菘菜伏砒石甘遂用生甘草湯小薺苨自然汁二味攪浸三日其水如墨汁更漉出用東流水淘六七次令水清為度漉出於土器中熬令脆用之一法麵包煨熱去面瓜蒂為之使惡遠志白蘞生取根搗爛可敷癰腫代赭為之使白芨水洗切紫石英為之使惡理石畏杏仁李核仁貫衆洗淨切片炒雚菌赤小豆為之使伏石鐘乳何首烏冬至後採者良入春則芽而中空矣北人以贋種欺人香氣不能混也臨用勿去皮以苦竹刀切米泔浸經宿同豆九蒸九曬木杵臼搗之勿犯鐵器茯苓為之使忌蔥蒜蘿蔔諸血無鱗魚威靈仙去蘆酒洗忌茶麵湯牽牛子即草金零入水中淘浮者去之取沉者曬乾拌酒蒸從巳至未曬乾臨用舂去黑皮用之黑者力速磨取頭末入藥得乾薑青木香良萆麻子形似巴豆節節有黃黑斑點凡使先須和皮用鹽湯煮半日去皮取子研過用忌炒豆伏丹砂粉霜天南星陳久松白者良滾湯明礬或薑汁拌和泡用一用泡過者為末入臘月黑牛膽中陰乾用蜀漆為之使得火牛膽良惡莽草畏附子乾薑防風生薑伏雌黃丹砂焰硝豨蘞方赤莖者良採葉陰乾醇酒拌九蒸九曬忌鐵苧根此物大能補陰而行滯血方藥以其目前賤物多不用白頭翁花子莖葉同蠡實為之使得酒良蘆根逆水生並黃泡肥厚味甘者良露根勿用去須節並赤黃皮用其汁消痰開胃下氣除熱解一切食物魚蝦河魨毒馬兜鈴凡使採得後去葉並蔓了用生絹袋盛於東屋角畔懸令乾了劈作片取向裡子去革膜並令淨用子勿令去革膜不盡用之並皮炒入藥仙茅刮上皮於槐砧上用銅刀切豆許大卻用生稀布袋盛於烏豆水中浸一宿取出用酒濕拌了蒸從巳至亥取出曝乾勿犯鐵斑人須鬢禁食牛乳及黑牛肉劉寄奴凡使去梗以布拭上薄殼皮令淨拌酒蒸從巳至申出曝乾用之莖葉花子皆可用骨碎補生江南根著樹石上採得用銅刀刮去上黃赤毛盡便細切用蜜拌令潤架柳甑蒸一日後出曝乾用一法去毛細切後用生蜜拌蒸從巳至亥連翹黑而閉口者良去蒂根研續隨子凡用去殼取色白者以紙包壓去油取霜用山豆根或末或研或噙咽白附子竹節者良炮去皮得火良預知子去皮研服水賊草去節童便浸一宿焙乾蒲公草自採鮮者入湯藥煎入丸末敷瘡毒搗爛用穀精草土瓜為之使忌鐵伏汞砂夏枯草土瓜為之使忌鐵伏汞砂山慈菰根出浙江處州府遂昌縣洪山地方市中無真者形光無毛本草注中雲有毛誤也燈心草蒸熟待乾折取中心白穰燃燈者是為熟草不蒸者生干剝取為生草入藥用之最難研以粳米粉漿染過曬乾研末入水澄之浮者是燈心也曬乾用海金沙或丸或散沙及草俱可入藥萱草根曬乾為末或用水煎酒煎研汁皆可服藿香自種者良揉之如蘹香氣者真薄荷香者非也絡石凡採得後用粗布楷葉上莖蔓上毛了用熟甘草水浸一伏時出切曬乾任用杜仲牡丹為之使惡鐵落畏貝母菖蒲殺孽毒木部桂凡使勿薄者要紫色厚者去上粗皮取心中味辛者使每斤大厚紫桂只取得五兩取有味厚處生用加未用即用重密熟絹並紙裹勿令犯風其州土只有桂草元無桂心用桂草煮丹陽木皮遂成桂心凡用即單搗用之得人參甘草麥門冬大黃黃芩調中益氣得柴胡紫石英乾地黃療吐逆忌生蔥石脂桂枝即桂之枝條輕薄者槐實凡採得後去單子並五子者只取兩子三子者凡使用銅槌槌之令破用烏牛乳浸一宿蒸過用景天為之使槐花未開時採收陳久者良入藥揀淨酒浸微炒若止血炒黑枸杞根即地骨皮凡使根掘得後用東流水浸以物刷上土了待乾破去心用熱甘草湯浸一宿然後焙乾用其根若似物命形狀者上春食葉夏食子秋食根並子也制硫黃丹砂枸杞子去蒂及枯者酒潤一夜搗爛入藥柏實去油者酒拌蒸另搗如泥或蒸熟曝烈舂簸取仁炒研入藥瓜子牡蠣桂為之使畏菊花羊蹄諸石及面曲伏砒硝柏葉向月令採之春東夏南秋西冬北使畏伏同實茯苓堅白者良去皮搗為末於水盆中攪三次將濁浮者去之是茯苓筋若誤服之令人眼中童子並黑精點小兼盲目切記如飛澄淨曬乾人乳拌蒸用赤茯苓則不必飛也使惡畏忌同茯神茯神去皮木用馬問為之使得甘草防風芍藥麥門冬紫石英療五臟惡白蘞畏地榆秦艽牡蒙龜甲雄黃忌米醋及酸物琥珀凡用紅松脂石珀水珀花珀物象珀翳珀琥珀紅松脂如琥珀只是濁太脆文橫水珀多無紅色如淺黃多粗皮皺石珀如石重色黃不堪用花珀文似新馬尾松心文一路赤一路黃物象珀其內自有物命動此使有神妙翳珀其珀是衆珀之長故號曰翳珀琥珀如血色於布上拭吸得芥子者真也大率以輕而透明者為佳入藥中用水調側柏子末安於瓷鍋子中安琥珀於末中了下火煮從巳至申別有異光別搗如粉重篩用一法用細布包納豆腐鍋中煮之然後灰火略煨過入目制用安心神生用酸棗粒粒粗勿碎皮者良炒爆研細入藥如砂仁法勿隔宿惡防己黃柏木即黃柏也凡使用刀削上粗皮了用生蜜水浸半日漉出曬乾用蜜塗文武火灸令蜜盡為度凡修事五兩用蜜三兩一法用鹽酒拌炒褐色惡乾漆伏硫黃楮實凡使採得後用水浸三日將物攪旋投水浮者去之曬乾用酒浸一伏時了便蒸從巳至亥出焙令乾用之松脂凡用以胡蔥同煮二十沸入冷水揉扯數十次曬乾用降真香以番舶來者色較紅香氣甜而不辣用之入藥殊勝色深紫者不良茗苦𣘻入清頭目藥用苦𣘻消食下氣用佳茗南燭莖葉搗汁漬米炊飯子入澀精補益藥用乾漆火煅黑煙起盡存性研如飛塵半夏為之使畏雞子紫蘇杉木漆姑草蟹忌油脂五加皮五葉者是剝皮去骨陰乾遠志為之使畏玄參蛇皮蔓荊實凡使去蒂子下白膜一重用酒浸一伏時後蒸從巳至未出曬用一法炒捶碎用惡烏頭石膏辛夷凡用去粗皮拭上白赤毛了去心即以芭蕉木浸一宿漉出用漿水煮過從巳至未出焙乾用若治眼目中患即一時去皮用向裡實者芎藭為之使惡五石脂畏菖蒲黃連蒲黃石膏黃環桑上寄生凡使在樹上自然生獨枝樹是也採得後用銅刀和根枝莖細銼陰乾了用忌火杜仲極厚者良削去粗皮每一斤用酥一兩蜜三兩和塗火炙以盡為度一法用酒炒斷絲以漸取屑方不焦惡玄參蛇蛻皮女貞實按本草女貞實與冬青似是而非也女貞葉長四五寸子黑冬青葉糰子微紅俱霜後採陰乾去粗皮內更有細皮實白色酒拌黑豆同蒸九次風香脂凡用以齏水煮二十沸入冷水中揉扯數十次曬乾用蕤核凡使湯浸去皮尖擘作兩片用芒硝木通草二味和蕤仁同水煮一伏時後漉出去諸般藥取蕤仁研成膏任加減入藥中使每修事四兩用芒硝一兩木通草七兩一法去衣綿紙包研去油用丁香凡使有雄雌雄顆小雌顆大似檈棗核方中多使雌力大膏煎中用雄若欲使雄須去下蓋乳子發人背癰也入煎藥為末調入或將好投入一二沸即傾畏鬱金忌火沉香凡使須要不枯色黑潤者良如觜角硬重沉於水下為上也半沉者次也入散中用須候衆藥出即入拌和用之入煎磨汁忌見火乳香圓小光明者良一方以燈心同研或以糯米數粒同研或以人畜甲二三片同研或以乳鉢坐熱水中乳之云皆易細總不如研細和人乳略蒸再研勻曬乾研如飛塵為妙藥將沉下一二沸即起勿多煮沒藥透明者良制同乳香法金櫻子熬膏服或和藥霜降後採金櫻子不拘多少以粗氣微搗去毛刺淨復搗破去子約有一斗用水二斗煮之一飯時漉起清汁又入白水煮之又漉起又入白水煮三次之後其渣淡而無味去之止將淨汁復以細密絹濾過淨鍋熬之如飴乃止收貯瓷樽中坐涼水內一宿用服之大能固精良方二仙丹即此膏加入芡實粉桑根白皮自採入土東行者或竹刀或銅刀刮去黃粗皮手析成絲拌蜜瓦上炙根浮土上者殺人桂心續斷麻子為之使忌鐵器桑葉煎湯研汁為末俱可經霜者另取洗眼用淡竹葉䈽竹葉別有用竹瀝用取新鮮金竹鋸尺許中留節兩頭去節劈兩開不拘多少用磚二塊架定竹兩頭出磚二寸許各以瓷盤置於下候瀝滴其中用烈火熏逼則兩頭濈濈滴瀝於盤中竹將自燃瀝便盡矣就將滴過瀝竹為薪又架新竹於磚上如前燒逼任取多少淡竹䈽竹苦竹慈竹惟四種各有瀝堪用薑汁為之使竹皮茹取極鮮竹刮皮磋去外硬青勿用止淡竹䈽竹苦竹堪用余不入藥吳茱萸凡使先去葉核並雜物了用大盆一口使鹽水洗一百轉自然無涎曬乾任入丸散中用修事十兩用鹽二兩研作末投東流水四斗中分作一百度洗別有大效若用醋煮即先沸醋三十餘沸後入茱萸待醋盡曬乾每用十兩使醋一鎰為度蓼實為之使惡丹參硝石白紫石英檳榔凡使取外存坐櫽心文如流水碎破內文如錦紋者妙半白半黑並心虛者不入藥用凡使須別檳與榔頭圓身形矮毗者是榔身形尖紫文粗者是檳檳力小榔力大欲使先以刀刮去底細切勿經火恐無力效若熟使不如不用梔子凡使勿用顆大者號曰伏尸梔子無力須要如雀腦並須長有九路赤色者上凡使先去皮須了取九稜者仁以甘草水浸一宿漉出焙乾搗曬如赤金未用大率治上焦中焦連殼用下焦去殼沉去黃漿炒用治血病炒黑用騏驎竭凡使勿用海母血真似騏驎竭只是味鹽並腥氣騏驎竭味微鹽甘似梔子氣是也欲使先研作粉重篩過丸散膏中任使用勿與衆藥同搗化作飛塵也得密陀僧良龍腦香即冰片也形似白松脂作杉木氣明淨者善久經風日或如雀屎者不佳今人多以樟腦身打亂之不可不辨也云合糯一作粳米炭相思子貯之則不耗膏主耳聾蕪荑炒去殼氣嗅如信者真枳殼凡使勿使枳實緣性效不同若使枳殼取辛苦腥並有隟油能消一切㿏要陳久年深者為上用時先去瓤以麩炒過待麩黑焦遂出用布拭上焦黑然後單搗如粉用産江右者良枳實色黑陳久者良去穰麩炒黃色厚朴凡使要用紫色有油質厚者良去粗皮用酥炙過每修一斤用酥四兩炙了細銼用若湯飲下使用自然薑汁八兩炙一升為度乾薑為之使惡澤瀉硝石寒水石忌豆山茱萸凡使勿用雀兒酥真似山茱萸只是核八稜不入藥用圓而紅潤肉厚者佳酒拌砂鍋上蒸去核了一斤取肉皮用只稱成四兩以來凡蒸藥用柳木甑去水八九寸水不泛上余悉准此蓼實為之使惡桔梗防風防己胡桐淚形似黃礬而堅實有夾爛木者木淚乃樹脂流出者其狀如膏油石淚乃脂入土石間者其狀成塊以其得滷斥之氣故入藥為勝伏砒石豬苓用銅刀削去粗皮一重薄切下東流水浸一夜至明漉出細切蒸一日出曬乾用一云豬苓取其行濕生用更佳烏藥連珠者良洗淨切龍眼生者沸湯淪過食不動脾安息香或燒熏或末服仙人杖此是筍欲成時立死者色黑如漆五六月收之海桐皮酒浸服亦可入煎五倍子或生或炒俱為末入藥大腹擘去垢黑用溫水洗淨再用黑豆汁洗方可用曬乾此樹鳩鳥多棲之遺屎在皮上不淨恐有毒今人用之不制大誤天竺黃輕者真伏粉霜密蒙花凡使先揀令淨用酒浸一宿漉出候乾卻拌蜜令潤蒸從卯至酉出曬乾如此拌蒸三度又卻曬乾用每修事一兩用酒八兩浸待色變用蜜半兩蒸為度此元名水錦花巴豆凡使巴之與豆及剛子須在仔細認勿誤用殺人巴顆小緊實色黃豆顆有三稜黑色剛子顆小似棗核兩頭尖巴與豆即用剛子勿使凡修事巴豆敲碎去油淨用白絹袋包甘草水煮焙乾或研膏用每修事一兩以酒麻油各七合盡為度為瘡瘍敷藥須炒黑存性能去瘀肉生新肉有神芫花為之使得火良惡蓑草牽牛畏大黃藜蘆黃連蘆筍醬豉豆汁冷水蜀椒一名南椒凡使須去目及閔口者不用其椒子先須酒拌令濕蒸從巳至午放令密蓋除下火四畔無氣後取出便入瓷器中盛勿令傷風用也杏仁為之使得鹽良畏款冬花防風附子雄黃槖吾冷水麻仁漿皂莢凡使須要赤膩肥並不蛀者用新汲水浸一宿用銅刀削上粗皮用酥反覆炙酥盡為度取出槌之去子搗篩皂莢一兩酥二分子收得揀取圓滿堅硬不蛀者用瓶盛下水於火畔煮待炮熟剝去硬皮一重了取向里白嫩肉兩片去黃其黃消人腎氣將白兩片用銅刀細切於日中乾用一法麵裹煨去核柏實為之使惡麥門冬畏空青人參苦參伏丹砂粉霜硫黃硇砂訶子本名訶黎勒凡使勿用毗黎勒罨黎勒榔精勒雜路勒若訶黎勒文只有六路或多或少並是雜路勒毗路勒個個毗雜路勒皆圓露文或八路至十三路號曰榔精勒多澀不入用凡修事先於酒內浸然後蒸一伏時其訶黎勒以刀削路細銼焙乾用之赤柳柳治痧疹聖藥也得之毒自出可不死楝實凡採得後曬乾酒拌浸令濕蒸待上皮軟剝去皮取肉去核勿單用其核槌碎用漿水煮一伏時了用如使肉即不使核使核即不使肉茴香為之使椿木椿木根凡使不近西頭者上及不用其葉只用根採出拌生蔥蒸半日出生蔥細銼用袋盛掛屋南畔陰乾用偏利溺澀也一法用根皮漂淨酒拌炒無食子凡使勿令犯銅鐵並被火驚者顆小文細上無杴米者炒用漿水於砂盆中或硬石上研令盡卻焙乾研了用勿搗能為黑犀色雷丸赤色者殺人取肉白者用甘草水浸一宿銅切刮上黑皮破作四五片又用甘草湯浸一宿後蒸從巳至未出曬乾卻以酒拌如前從巳至未蒸曬乾用一法用蒼朮湯泡去皮切厚朴芫花蓄根荔實為之使惡葛根蘇方木紅潤者良凡使去粗皮並節了若有中心文橫如紫角者號曰木中尊色甚致倍常百等須細銼了重搗拌細條梅枝蒸從巳至申出陰乾用楜椒凡使只用內無皺殼者用方大漢椒使殼胡椒使子每修煉了於石槽中碾碎成粉用益智子去殼炒臨用研樺木皮主諸黃疸濃煮汁飲之良棐實同鵝肉食生斷節風又上壅人皮反緑豆能殺人忌火氣木鱉子入藥去油者柞木子能開交骨所以催生有神棕櫚子入藥燒灰用不可絶過即是煅存性研如飛塵散瘀止血之神藥也木槿入藥炒用取汁度絲使得易落果部豆蔻俗名草果者是也去蒂並內裡子後取皮同茱萸於鍋中緩炒待茱萸微黃黑即去茱萸取草豆蔻皮及子杵用之蓮肉去心勿去皮分作兩片每片分作四小塊瓦上焙焦色一法每一斤用獖豬肚一個盛貯煮熟搗焙用之得茯苓山藥白朮枸杞子良荷鼻採荷葉近蒂者是畏桐油伏白銀硫黃橘皮真廣陳皮豬鬃紋香氣異常去白時不可浸於水中止以滾湯手蘸三次輕輕刮去白要極淨橘核以新瓦焙香去殼取仁研碎入藥青皮以湯浸去瓤切片醋拌瓦炒過用大棗去核有齒病疳病蟲䘌人及小兒不宜食忌與蔥同食令人五臟不和與魚同食令人腰腹痛栗日中曝乾食下氣補益火煨去汗亦佳生食有木氣不補益人蒸炒熟食壅氣凡患風人及小兒不可食解羊肉膻覆盆子凡使用東流水淘去黃葉並皮蒂儘子用酒拌蒸一宿以東流水淘兩遍曬乾方用為妙也雞頭實凡用蒸熟烈日曬裂取仁亦可舂取粉用入澀精藥有連殼用者一云芡實一斗以防風四兩煎湯浸過用且經久不壞烏梅去核微炒用造法取青梅籃盛於突上燻黑若以稻灰淋汁潤濕蒸過則肥澤不蠹忌豬肉木瓜産宣州者真即彼處多以小梨充之勿令犯鐵用銅刀削去硬皮並子薄切於日中曬卻用黃牛乳汁拌蒸從巳至未其木瓜如膏煎卻於日中攤曬乾用也今止去穰槌碎用柿不用火烘日曬採青者收置器中自然紅熟澀味盡去而甘不可與蟹同食作瀉惟木香磨汁飲可解柿霜用大柿去皮捻遍日曬夜露至干內甕中待生白霜乃取出市者多僞不入藥烏芋即荸薺也能消瘴氣枇杷葉凡使採得後稱濕者一葉重一兩乾者三葉重一兩是氣足堪用以粗布拭上毛令盡用甘草湯洗一遍卻用綿再拭極淨每一兩以酥一分炙之酥盡為度如治肺病以蜜水塗炙治胃病以薑汁塗炙此物治咳嗽如去毛不盡反令人嗽也甘蔗榨漿飲消渴解酒痧疹最宜桃仁七月採之去皮尖及雙仁者麩炒研如泥或燒存性用此破血行瘀血之要藥也雷公法用白朮烏豆二味和桃仁同於垍堝子中煮一伏時後漉出用手擘作兩片其心黃如金色任用之行血宜連皮尖生用香附為之使桃花三月三日採陰乾之勿使干葉者能使人鼻衄不止目黃凡用揀令淨以絹袋盛於檐下懸令乾去塵用桃梟是千葉桃花結子在樹上不落者於十一月內採得一云正月採之中實者良凡修事以酒拌蒸從巳至未焙乾以銅刀切焙取肉用一法搗碎炒若止血炒黑存性杏仁五月採之以湯浸去皮尖及雙仁者麩炒研用治風寒肺病藥中亦有連皮尖用者取其發散也梨子消熱痰加牛黃末療小兒風疾痰湧有神解熱毒久服不患癰疽橄欖中河豚毒煮汁服或生嚼山楂水潤蒸去核淨肉用米穀部胡麻凡修事以水淘浮者去之沉者漉出令乾以酒拌蒸從巳至亥出攤曬乾於臼中舂令粗皮一重盡拌小豆相對同炒小豆熟即出去小豆用之蒸不熟令人發落與茯苓相宜麻子極難去殼取帛包置沸湯中浸至冷出之垂井中一夜勿令著水次日日中曝乾就新瓦上挼去殼簸揚取仁粒粒皆完畏牡蠣白茯苓白薇飴糖糯米作者入藥粟米者次之餘但可食耳生大豆或搗或煮汁或炒屑各有用得前胡烏喙杏仁牡蠣諸膽汁良惡五參龍膽豆黃屑忌豬肉小兒以炒豆豬肉同食必壅氣致死十有八九十歲以上不畏也赤小豆法同大豆合魚酢食成消渴
