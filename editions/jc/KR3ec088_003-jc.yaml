front:
  text: 服藥序次病在胸膈以上者先食後服藥病在心腹以下者先服藥而後食病在四肢血脈及下部者宜空腹而在旦病在頭目骨髓者宜飽滿而在夜雖食前食後亦停少頃然後服藥食不宜與藥並行則藥力稍為混滯故也湯液云藥氣與食氣不欲相逢食氣稍消則服藥藥氣稍消則進食所謂食先食後蓋有義在其中也又有酒服者飲服者冷服者暖服者服湯有疏有數者煮湯有生有熟者各有次第並宜詳審而勿略焉清熱湯宜涼服如三黃湯之類消暑藥宜冷服如香薷飲之類散寒藥宜熱服如麻黃湯之類溫中藥宜熟而熱補中藥皆然利下藥宜生而溫如承氣湯之類病在上者不厭頻而少病在下者不厭頓而多少服則滋榮於上多服則峻補於下凡云分再服三服者要令勢力相及並視人之強弱羸瘦病之輕重為之進退增減不必局於方說則活潑潑地也又云晬時周時也從今旦至明旦亦有止一宿者
