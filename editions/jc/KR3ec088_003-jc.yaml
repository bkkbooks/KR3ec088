body:
  text: 酒人為火燎以陳酒浸之止痛拔出火毒令人不死粟米即小米陳者良與杏仁同食令人吐瀉秫米小兒病人不宜多食粳米陳者下氣病人宜之糵米凡谷皆可生糵有粟黍穀麥豆諸糵皆水浸脹候生芽曝乾去須取其中米炒研面用其功皆主消導粟糵稻糵穬麥糵各有用舂杵頭細糠凡谷皆有糠粳稻粟秫者勝北方多用杵南方多用碓入藥並用丹家云糠火煉物力倍於常小麥浮者止汗須揀淨焙用麥麩性涼用炒諸藥蕎麥壓丹石毒作面和豬羊肉熱食不過八九頓即患熱風鬚眉脫落還生亦希涇汾以北多此疾又不可合黃魚食家常多犯故特拈著曲凡使須陳久者搗作末後掘地坑深二尺用物裹納坑中至一宿明出焙乾用神麯五月五日六月六日或三伏日為諸神集會之辰故名神麯如過此日造者非也法用白虎白麵一百斤勾陳蒼耳自然汁三升騰蛇青蓼自然汁四升青龍青蒿自然汁三升玄武杏仁四升泡去皮尖搗爛入面朱雀赤小豆三升煮熟去皮搗爛和麵一處勻一如造酒面法以麻葉或楮葉包罯如造醬黃法待生黃衣曬收之凡用須火炒黃以助土氣陳久者良扁豆紫花者良炒去殼打碎解酒河豚魚一切草木毒生嚼及煮汁飲淡豆豉出江西者良黑豆性乎作豉則溫既經蒸罯故能升能散得蔥則發汗得鹽則能吐得酒則治風得薤則治痢得蒜則止血炒熟則又能止汗紅曲亦出江西陳久者良吹淨炒研用綠豆生研絞汁或煮食用之宜連皮去皮則令人少壅氣當是皮寒肉乎故也圓小綠者佳反榧子殼忌鯉魚酢解金石砒霜一切草木諸毒連皮生研水服醋米造陳者良醋酒為用無所不入故製藥多用之服茯苓丹參不可食醋醬豆作者良麥作者不用以久久為佳又有肉醬魚醬皆呼為醢不入藥用罌子粟用熱水泡軟擘去筋膜切成絲用蜜水或米醋拌微炒曬乾用忌蒜醋胡椒菜部瓜蒂凡使勿用白瓜蒂要採取青綠色瓜待瓜氣足其瓜蒂自然落在蔓莖上採得未用時使櫛櫛葉裹於東牆有風處掛令吹乾用白冬瓜此物經霜後皮上白如粉塗故云白冬瓜也被霜後取置經年破取核水洗燥去殼擂仁用一用皮肉搗絞汁服白芥子研用萊菔生食熟食俱可治久脾泄百藥不效煮食經年無不效者但不可與地黃同食多食動氣惟生薑能制其毒伏硇砂萊菔子炒研能消食性峻利傷人真氣勿久服黃蜀葵花瘡家要藥作末及浸油俱可蔥頭取根白一二寸連須用洗淨忌蜜及常山韭絞生汁飲其子入藥揀淨蒸熟曝乾簸去黑皮炒黃研用忌蜜及牛肉伏石鐘乳乳香荊芥陳者良去梗取穗若用止血須炒黑蘇子自收方真市者俱偽略炒研極細煎成藥投入二三沸即傾紫蘇兩面俱紫自種者真薄荷產蘇州龍腦者良苦匏即苦壺盧也凡用須細理瑩淨無黶翳者乃佳不爾有毒馬齒莧凡使勿用葉大者不是馬齒莧亦無水銀忌與鱉同食食之俱變成鱉齧人腹至不可治蕺菜治肺癰俗名魚腥草生陰處木耳桑槐樹上生者良煮羹食有用罐盛大火內煅去煙存性為末入藥人部發髲凡使是男子年可二十以來無疾患顏貌紅白於頂心剪下者發是凡於丸散膏中先用苦參水浸一宿漉出入瓶子以火煅之令通赤放冷研用人乳汁白而不腥者良人牙齒入藥燒用人糞宜用絕乾者搗末沸湯沃服之一名金汁埋地中年久者良人溺肥白無病童子味不咸雪白者良人中白溺器中者良火煅研褲襠取中裩近隱處男用女女用男或取汁或燒灰服天靈蓋凡用彌腐爛者佳有一片如三指闊者取得用煻灰火罨一夜待腥穢氣盡卻用童便於瓷鍋中煮一伏時漉出於屋下握得一坑深一尺置骨於中一伏時其藥魂歸神妙陽人使陰陰人使陽男骨色不赤女骨色赤以此別之一法同檀香湯洗過酥炙用或燒存性用紫河車置酒內覆者男胎也首胎重十五兩以上先將酒洗數次血水方盡用銀簪腳剔去筋膜封固銀鍋內加酒重湯煮一晝夜或文武火焙乾一法米泔浸淨入豬肚中蒸爛搗膏入藥忌犯鐵獸部龍骨骨細文廣者是雌骨粗文狹者是雄骨五色者上白色者中黑色者次黃色者稍得經落不淨之處並婦人採得者不用洗淨摶研如粉極細方入藥其效始神但是丈夫服空心益腎藥中安置圓龍骨氣入腎臟中也雷公所云生用法也一法用酒浸一宿焙乾研粉水飛三度用如急用以酒煮焙乾或云凡入藥須水飛曬乾每斤用黑豆一斗蒸一伏時曬乾用否則著人腸胃晚年作熱也得人參牛黃黑豆良畏石膏鐵忌魚龍齒搗碎入丸煅研得畏忌同龍骨麝香其香有三等一者名遺香是麝子臍閉滿其麝自於石上用蹄尖揮臍落處一里草木不生並焦黃人若收得此香價與明珠同也二名膝香採得甚堪用三名心結香被犬獸驚心破了因茲狂走雜諸群中遂乳投水被人收得擘破見心流在脾結作一個乾血塊可隔山澗早聞之香是香中之次也凡使麝香並用子日開之方用細研篩用之也當門子良凡用另研忌大蒜牛黃凡使有四件第一件是生神黃賺得者次有角黃是取之者又有心黃是病死後識者剝之劈破取心其黃在心中如濃黃醬汁採得便投於水中黃沾水復便如碎蒺藜子許如豆者硬如帝珠子次有肝黃其牛身上光眼如血色多玩弄好照水自有夜光恐懼人或有人別採之凡用須先單搗細研如塵卻絹裹又用黃嫩牛皮裹安於井面上去水三四尺以來一宿至明方取用之人參為之使得牡丹菖蒲利耳目惡龍骨龍膽地黃常山蜚蠊畏牛膝乾漆象牙刮取屑細研用鹿角膠自煎者良酒化服為上或用麥門冬橘紅砂仁煎湯化服入丸用酒或水頓化和蜜或炒成珠亦得得火良畏大黃阿膠油綠色光明可鑑者真凡使先於豬脂內浸一宿至明出於柳木火上炙待炮了可研用只以蛤粉炒成珠用為便薯蕷為之使得火良畏大黃白馬莖凡收當取銀色無病白馬春月遊牝時力勢正強者生取陰乾百日用一法以銅刀破作七片將生羊血拌蒸半日曬乾以粗布去毛及乾血銼碎用鹿茸須茄茸如琥珀紅潤者良凡使先以天靈蓋作末然後鋸解鹿茸作片子以好羊脂拌天靈蓋末塗之於鹿茸上慢火炙之令內外黃脆瞭如褐色用鹿皮一片裹之安室上一宿其藥魂歸也至明則以慢火焙之令脆方搗作末用之每五兩鹿茸用羊脂三兩炙盡為度茸中有小白蟲視之不見入人鼻必為顙蟲藥不及也切不可以鼻嗅麻勃為之使牛膽臘月黃牛青牛者良牡狗陰莖六月上伏日取陰乾百日切片酥拌炒羚羊角帶黃色者角彎中深銳緊小有掛痕者真耳邊聽之集集鳴者良凡修事勿令單用不復有驗須要不折原對以繩縛之將鐵錯子錯之旋旋取用勿令犯風錯末盡處須二重紙裹恐力散也錯得了即單搗搗盡背風頭重篩過然後入藥中用免刮人腸也一說密裹藏懷中取出搗易碎犀角凡使以黑如漆黃如慄上下相透雲頭雨腳分明者為上次用烏黑肌粗皺摺裂光潤者良近人多巧偽藥染湯煮無所不至須辨之凡修治錯其屑入臼中搗令細再入缽中研萬匝方入藥中用之一說入人懷內一宿易碎或磨汁入藥用松脂升麻為之使惡雷丸雚菌烏頭烏喙忌鹽妊婦勿服能消胎氣虎骨脛骨良頭頸骨俱可用色黃者佳雄虎者勝藥箭射殺者不可入藥其毒浸漬骨血間能傷人也製法並捶碎去髓塗酥或酒或醋各隨方法炭火炙黃入藥豬懸蹄古方有用左蹄甲者有後蹄甲者酒浸半日炙焦用豬四足母豬者良豬膽陰乾汁亦可和藥豬肚豬水畜而胃屬土故方藥用之補虛以胃治胃也糜角煎膠與鹿角膠同法取霜用角水浸七日刮去皮錯屑以銀瓶盛牛乳浸一日乳耗再加至不耗乃止用油紙密封瓶口別用大麥鋪鍋中三寸上安置再以麥四周填滿入水浸一伏時水耗旋加待屑軟如面取出焙研成霜用狐陰莖炙為末酒服獺肝炙脆研諸畜肝葉皆有定數惟獺肝一月一葉十二月十二葉其間又有退葉用之須見形乃可驗不爾多偽也猯肉膏油入膏藥中拔濕如神趙府膏藥中用之膃肭臍此物多偽海中有獸號曰水烏龍海人採得殺之取腎藥中修合恐有誤其物自殊有一對其有兩重薄皮裹丸氣肉核皮上自有肉黃毛三莖其一穴年年陰濕常如新兼將於睡著犬躡足置於犬頭其驀驚如狂即是真也用酒浸一宿後以布裹微微火上炙令青細銼單搗用也以漢椒樟腦同收則不壞禽部雄雀屎凡使勿用雀兒糞其雀兒口黃未經淫者糞名雀蘇不入藥雄屎兩頭尖圓者是凡採得先去雨畔有附子生者勿用缽中研如粉煎甘草湯浸一宿傾上清甘草水盡焙乾任用日華子云凡鳥左翼掩右者是雄其屎頭尖挺直伏翼凡使要重一斤者先拭去肉上毛及去爪腸留肉翅並嘴腳以好酒浸一宿取出以黃精自然汁五兩塗炙至盡炙乾用一法止煅存性近世用者多煅存性耳莧雲實為之使天鼠屎即伏翼糞方言名天鼠爾一名夜明砂凡採得以水淘去灰土惡氣取細砂曬乾焙用其砂乃蚊蚋眼也惡白蘞白薇蟲魚部石蜜凡煉蜜只得十二兩半是數若火少火過並用不得凡煉蜜每斤入水四兩銀石器內以桑柴火慢煉掠去浮沫至滴水成珠不散乃用謂之水火煉法又法以器盛置重湯中煮一日候滴水不散取用更不傷火蜜蠟蠟乃蜜脾底也取蜜後煉過濾入水中候凝取之色黃者名黃蠟煎煉極淨色白者名白蠟一說新則白久則黃非也與今時所用蟲造白蠟不同惡芫花齊蛤牡蠣左顧者良東流水入鹽一兩煮一伏時後入火中燒令通赤然後入缽中研如粉用也一法火煅醋淬七次研極細如飛面貝母為之使得甘草牛膝遠志蛇床子良惡麻黃辛夷吳茱萸伏硇砂真珠於臼中搗令細以絹羅重重篩過卻便研二萬下了用不細則傷人臟腑凡使要不傷破及鑽透者可用也一法入豆腐內蒸易碎入目生用不用蒸依上法為是玳瑁入藥生用以其性味全也既經陽火即不堪用與生熟犀角義同桑螵蛸凡使勿用諸雜樹上生者不入藥中用須桑樹畔枝上者採得去核子用沸漿水浸淘七遍令水遍沸於瓷鍋中熬令乾用勿亂別修事卻無效也得龍骨止精畏旋覆花戴椹石決明即真珠母也七九孔者良先去上粗皮用鹽並東流水於大瓷器中煮一伏時了漉出拭乾搗為末研如粉更用東流水於瓷器中如此淘之三度待乾再研一萬匝方入藥中用凡修事五兩以鹽半分則取服之十兩永不得食山桃令人喪目也海蛤此即鮮蛤子雁食後糞中出有文彩者為文蛤無文彩者為海蛤鄉人多將海岸邊爛蛤殼被風濤打磨瑩滑者偽作之凡修事一兩於漿水中煮一伏時後卻以地骨皮柏葉各二兩又煮一伏時後於東流水中淘三遍拭乾細搗研如粉用蜀漆為之使畏狗膽甘遂芫花文蛤修事法同海蛤蠡魚俗名烏魚亦名黑魚諸魚中惟此膽甘可食鯽魚子不宜與豬肉同食同砂糖食生疳蟲同芥菜食成腫疾同豬肝雞肉雉肉鹿肉猴肉食生癰疽同麥門冬食害人蝟皮作豬蹄者妙鼠腳者次炙脆研用露蜂房治臃腫醋水調塗治瘡煎洗入藥炙用惡乾薑丹參黃芩芍藥牡蠣蟬蛻用沸湯洗淨泥土去頭足翅用攻毒全用烏賊魚骨凡使要上文順渾用血滷作水浸並煮一伏時了漉出於屋下掘一地坑可盛得前件烏賊魚骨多少先燒坑子去炭灰了盛藥一宿至明取出用之其效倍多惡白芨白蘞附子原蠶蛾炒去翅足用蠶蛻近世醫家多用蠶蛻紙而東方諸醫用蠶欲老眠起所蛻皮雖二者之用各殊然東人所用者為正用之當微炒白殭蠶凡使除絲綿並子盡以糯米泔浸一宿待蠶桑涎出如蝸牛涎浮於水面上然後漉出微火焙乾以布淨拭蠶上黃肉毛並黑口甲了單搗篩如粉用也白而直折開如瀝青色者佳惡桔梗茯苓茯神萆薢桑螵蛸蛞蝓即蜒蚰也畏鹽蝸牛此即負殼蜒蚰也生研服入藥炒用鹽䗪蟲即俗名地鱉也生人家牆壁下土中濕處治傷寒損續絕及消瘧母為必須之藥也能行瘀血畏皂莢菖蒲屋遊青魚膽鮮者可煮服乾者用醋及水磨用鱉甲七九肋者良醋炙透焦研細再拌醋瓦上焙乾再研如飛面惡礬石理石蠍形緊小者良酒洗淨炙乾研蟾酥端午日取蝦蟆眉脂其法取大蝦蟆用蛤蜊殼未離帶者合蝦蟆眉上用力一捻則酥出於殼內收在油明紙上干收貯用蝦蟆放去而酥復生仍活鼠糞牡鼠者良其糞兩頭尖蚺蛇膽人多以豬膽虎膽偽為之試法剔取粟許著淨水中浮游水上回旋行走者為真偽者亦走但遲耳其徑沉者諸膽血也勿多著亦沉散也蛇蛻凡使勿用青黃蒼色者要用白如銀色者凡欲使先於屋下以地掘一坑可深一尺二寸安蛇皮於中一宿至卯時出用醋浸一時於火上炙乾用之得火良畏磁石及酒白頸蚯蚓凡使收得後用糯米水浸一宿至明漉出以無灰酒浸一日至夜漉出曬令乾後細切取蜀椒並糯米及切了蚯蚓三件同熬之待糯米熟去米椒了揀淨用之凡修事二兩糯米一分椒一分為準畏蔥鹽蜈蚣凡使勿用千足蟲真似只是頭上有白肉而並嘴尖若誤用並聞著腥臭氣入頂致死凡治蜈蚣先以蜈蚣木末不然用柳蚛末於土器中炒令木末焦黑後去木末了用竹刀刮去足甲了用蜈蚣木不知是何木也今人惟以火炙去頭足用或去尾足以薄荷葉火煨用之畏蛞蝓蜘蛛白鹽雞屎桑白皮蛤蚧凡使須認雄雌若雄為蛤皮粗口大身小尾粗雌為蚧口尖身大尾粗男服雌女服雄凡修事服之其毒在眼須去眼及去甲上尾上腹上肉毛以酒浸方乾用紙兩重於火上緩隔紙焙炙待兩重紙乾焦透後去紙取蛤蚧於瓷器中盛於東舍角畔懸一宿取用力可十倍勿傷尾效在尾也一云只含少許急奔百步不喘者真水蛭極難修制須細銼後用微火炒令色黃乃熟不爾入腹生子為害一法採得以䈽竹筒盛待乾用米泔浸一夜曝乾展其身看腹中有子皆去之以冬豬脂煎令焦黃然後用畏石灰食鹽斑蝥入藥除翼足以糯米拌炒米黃黑色去米取用生用吐瀉人一法用麩炒過醋煮用馬刀為之使畏巴豆丹參空青惡膚青甘草豆花斑蝥芫青亭長地膽之毒靛汁黃連黑豆蔥茶皆能解之白花蛇一云去頭尾各一尺有大毒不可用只用中叚一云黔蛇長大故頭尾可去一尺蘄蛇止可頭尾各去三寸亦有單用頭尾者大蛇一條只得淨肉四兩而已久留易蛀惟以湯浸去皮骨取肉炙過蜜封藏之十年亦不壞也其骨刺須遠棄之傷人毒與生者同也凡酒浸春秋三宿夏一宿冬五宿取出炭火焙乾如此三次以砂瓶盛埋地中一宿出得酒良烏蛇制同上法蜣螂五月五日取蒸藏之臨用當炙勿置水中令人吐五靈脂此是寒號蟲糞也此物多夾砂石絕難修治凡用研為細末以酒淘飛澄去砂腳曬乾醋拌炒惡人參穿山甲正名鯪鯉或炮或燒或酥炙醋炙童便炙或油煎土炒蛤粉炒當各隨本方未有生用者仍以尾甲乃力勝予見今之時師童而習之俱藥性櫽括駢語守為家珍而於神農本草及先賢炮炙法一切高文大牘竟未嘗夢見臨證用藥方產之真贗莫別修事之軌則全乖欲以攻病譬如克敵致勝責效於不練之猝至病者甘以七尺之軀往往聽其嘗試良可憫也先生曰子言誠然因檢目前嘗用諸藥品悉按雷公炮炙去其迂闊難遵者而裁以已法其無雷公者則自為闡發以益前人所未逮凡諸使制解伏並反忌惡畏等附系其下庶病家考用一覽瞭然兼可質醫師之誤其所裨益功豈鮮哉舊筆記所刻止九十餘種今廣至四百三十九種一一皆先生口授而予手錄之其間刪繁舉要補闕拾遺句字之出入必嚴點畫之幾微必審稿凡四易始付殺青予竊有微勞焉延陵莊繼光謹識用藥凡例藥劑丸散湯膏各有所宜不得違制藥有宜丸宜散者宜水煎者宜酒漬者宜煎膏者亦有一物兼宜者亦有不可入湯酒者並隨藥性不可過越湯者蕩也煎成清汁是也去大病用之散者散也研成細末是也去急病用之膏者熬成稠膏也液者搗鮮藥而絞自然真汁是也丸者緩也作成圓粒也不能速去病舒緩而治之也漬酒者以酒浸藥也有宜酒浸以助其力如當歸地黃黃柏知母陰寒之氣味假酒力而行氣血也有用藥細銼如法煮酒密封早晚頻飲以行經絡或補或攻漸以取效是也凡諸湯用酒臨熟加之細末者不循經絡止去胃中及臟腑之積及治肺疾咳嗽為宜氣味厚者白湯調氣味薄者煎之和渣服丸藥去下部之病者極大而光且圓治中焦者次之治上焦者極小麵糊丸取其遲化直至下焦或酒或醋取其收斂如半夏南星欲去濕者以生薑汁稀糊丸取其易化也湯泡蒸餅又易化滴水尤易化煉蜜丸者取其遲化而氣循經絡也蠟丸者取其難化而遲取效也凡修丸藥用蜜只用蜜用餳只用餳勿交雜用且如丸藥用蠟取其能固護藥之氣味勢力全備以過關膈而作效也今若投蜜相和雖易為丸然下咽亦易散化如何得到臟中若其更有毒藥則便與人作病豈徒無益而又害之全非用蠟之本意凡煉蜜皆先掠去末令熬色微黃試水不散再熬二三沸每用蜜一斤加清水一酒杯又熬一二沸作丸則收潮氣而不黏成塊也冬月煉蜜成時要加二杯水為妙衍義云每蜜一斤只煉得十二兩是其度數也和藥末要乘極滾蜜和之臼內用搗千百杵自然軟熟容易作條好丸也凡丸散藥亦先細切暴燥乃搗之有各搗者有合搗者其潤濕之藥如天門冬地黃輩皆先切曝之獨搗或以新瓦慢火炕燥退冷搗之則為細末若入眾藥隨以和之少停回潤則和之不均也又濕藥燥皆大蝕耗當先增分兩待燥稱之乃准其湯酒中不須如此凡合丸藥用密絹令細若篩散藥尤宜精細若搗丸必於臼中搗數百過色理和同為佳凡藥浸酒皆須切細生絹袋盛乃入酒密封隨寒暑目數視其濃烈便可漉出不須待酒盡也渣則暴燥微搗更漬飲之亦可散服之凡合膏或以醋或酒或水或油須令淹浸密覆至煮膏時當三上三下以泄其熱勢令藥味得出上之使匝匝沸下之要沸靜良久乃上之如有韭白在中者以兩段漸焦黃為度如有白芷附子者亦令小黃為度絞膏要以新布若是可服之膏滓亦可以酒煮飲之可磨之膏渣亦宜以敷患處此蓋欲兼盡具藥力也凡湯酒膏中用諸石藥皆細搗之以新絹裹之內中衍義雲石藥入散如鍾乳粉之屬用水研乳極細必要二三日乃已以水漂澄極細方可服耳豈但搗細以絹裹之為例耶凡煎膏中有脂先須揭去革膜子方可用之如豬脂勿令經水臘月者尤佳凡膏中有雄黃硃砂輩皆當令研如面俟膏畢乃投入以物杖攪之不爾沉聚在下不勻也凡草藥燒灰為末如荷葉柏茅根薊根十灰散之類必燒焦枯用器蓋覆以存性若如燒燃柴薪煅成死灰性亦不存而罔效矣凡諸膏膩藥如桃仁麻仁輩皆另搗如膏乃以內成散中旋次下臼合研令消散煎藥則例凡煎湯劑必先以主治之為君藥先煮數沸然後下余藥文火緩緩熬之得所勿揭蓋連罐取起坐涼水中候溫熱服之庶氣味不泄若據乘熱揭封傾出則氣泄而性不全矣煎時不宜烈火其湯騰沸耗蝕而速涸藥性未盡出而氣味不純人家多有此病而反責藥不效咎將誰歸發汗藥先煎麻黃二三沸後入余藥同煎止汗藥先煎桂枝二三沸後下眾藥同煎和解藥先煎柴胡後下眾藥至於溫藥先煎乾姜行血藥先煎桃仁利水藥先煎豬苓止瀉藥先煎白朮茯苓止渴藥先煎天花粉乾葛去濕藥先煎蒼朮防己去黃藥先煎茵陳嘔吐藥先煎半夏生薑風藥先煎防風羌活暑藥先煎香薷熱藥先煎黃連凡諸治劑必有主治為君之藥俱宜先煎則效自奏也凡湯中用麻黃先另煮二三沸掠去上沫更益水如本數乃內余劑不爾令人煩凡用大黃不須細銼先以酒浸令淹浹密覆一宿明旦煮湯臨熟乃內湯中煮二三沸便起則勢力猛易得快利丸藥中微蒸之恐寒傷胃也凡湯中用阿膠飴糖芒硝皆須待湯熟起去渣只內淨汁中煮二三沸熔化盡仍傾盞內服凡湯中用完物如干棗蓮子烏梅仁決明子青葙蔓荊蘿蔔芥蘇韭等子皆劈破研碎入煎方得味出若不碎如米之在谷雖煮之終日米豈能出哉至若桃杏等仁皆用湯泡去皮尖及雙仁者或搗如泥或炒黃色用或生用俱可凡用砂仁豆蔻丁香之類皆須打碎遲後入藥煎數沸即起不爾久久煎之其香氣消散也是以效少凡湯中用犀角羚羊角一概末如粉臨服內湯中後入藥一法生磨汁入藥亦通凡用沉香木香乳沒一切香末藥味須研極細待湯熱先傾汁小盞調香末服訖然後盡飲湯藥凡煎湯藥初欲微火令小沸其水數依方多少大略藥二十兩用水一斗煮四升以此為準然利湯欲生少水而多取汁補湯欲熟多水而少取汁服湯宜小沸熱則易下冷則嘔湧凡湯液一切宜用山泉之甘洌者次則長流河水井水不用服藥禁忌服柴胡忌牛肉服茯苓忌醋服黃連桔梗忌豬肉服乳石忌參朮犯者死服丹石不可食蛤蜊腹中結痛服大黃巴豆同劑反不瀉人服皂礬忌蕎麥麵服天門冬忌鯉魚服牡丹皮忌胡荽服常山忌蔥服半夏菖蒲忌飴糖羊肉服白朮蒼朮忌雀蛤肉青魚鮓胡荽大蒜桃李服鱉甲忌莧菜馬齒莧尤甚服商陸忌犬肉服地黃忌蘿蔔服細辛忌生菜服甘草忌菘菜服粟殼忌醋服芫花甘遂忌鹽忌甘草服荊芥忌驢馬肉黃顙魚服柿蒂忌蟹犯者木香湯能解服巴豆忌蘆筍服牛膝忌牛肉牛乳服蜜及蜜煎果食忌魚鮓服藜蘆忌狐貍肉若瘡毒未愈不可食生薑雞子犯之則肉長突出作塊而白凡服藥不可雜食肥豬犬肉油膩羹膾腥臊陳臭諸物凡服藥不可多食生蒜胡荽生蔥諸果諸滑滯之物凡服藥不可見死屍產婦淹穢等事妊娠服禁蜆班水蛭及虻蟲烏頭附子配天雄葛根水銀並巴豆牛膝薏苡與蜈蚣三稜代赭莞花射大戟蛇蛻黃雌雄牙硝芒硝牡丹桂槐花牽牛皂角同半夏南星與通草瞿麥乾薑桃仁通磠砂乾漆蟹甲爪地膽茅根都不中妊娠禁忌前歌所列藥品未盡特為拈附烏喙側子藜蘆薇銜厚朴槐實欓根䕡茹茜根赤箭䒽草鬼箭紅花蘇木麥糵葵子常山錫粉硇砂砒石硫黃石蠶芫青斑蝥蜘蛛螻蛄衣魚蜥蜴飛生䗪蟲樗雞蚱蟬蠐螬蝟皮牛黃兔肉犬肉馬肉驢肉羊肝鯉魚蝦蟆羊躑躅葛上亭長鰍鱔龜鱉生薑小蒜雀肉馬刀六陳枳殼陳皮並半夏茱萸狼毒及麻黃六般之藥宜陳久入用方知功效良十八反本草明言十八反逐一從頭說與君人參芍藥與沙參細辛玄參與紫參苦參丹參並前藥一見藜蘆便殺人白芨白蘞並半夏栝蔞貝母五般真莫見烏頭與烏喙逢之一反疾如神大戟芫花並海藻甘遂以上反甘草若還吐蠱用翻腸尋常犯之都不好蜜蠟莫與蔥相睹石決明休見雲母黎蘆莫使酒來浸人若犯之都是苦當禁不禁犯禁必死張子和云病腫脹既平當節飲食忌鹽血房室犯禁者病再作乃死不救病癆嗽忌房室膏粱犯者死傷寒之後忌葷肉房事犯之者不救水腫之後忌油鹽病脾胃傷者節飲食滑瀉之後忌油膩此數者決不可輕犯也時病新愈食蒜鱠者病發必致大困時病新愈食犬羊肉者必作骨蒸熱時病新愈食生棗及羊肉必作鬲上熱蒸時病新愈食生菜令人顏色終身不平復病人新愈飲酒食韭病必復作不必忌而忌之過張子和曰臟毒酒毒下血嘔血等症如婦人三十以下血閉及六七月間血痢婦初得孕擇食者以上皆不禁口凡久病之人胃氣虛弱者忽思葷茹亦當少少與之圖引漿水穀氣入胃此權變之道也若專以淡粥責之則病不悅而食減不進胃氣所以難復病所以難痊此忌之之過也智者通之
